name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      # Tests needing the sandbox, WFDB or Octave skip themselves here; see the README for a full run.
      - run: uv run pytest -q
