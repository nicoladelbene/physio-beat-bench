name: Diagnose Linux differences
# TEMPORARY, remove before merging. Reruns only the entries whose Linux results differed from the
# macOS baseline and uploads their build and run logs and outputs. Triggered by a push to this
# branch whose commit message starts with [diagnose-linux].
on:
  push:
    branches: [linux-reproduction]
permissions:
  contents: read
jobs:
  diagnose:
    if: startsWith(github.event.head_commit.message, '[diagnose-linux]')
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      WFDB_HOME: ${{ github.workspace }}/data/tools/wfdb
      ENTRIES: >-
        fplesinger-25 rapr-25 hoog.antink-407 laurent.sorber-21 jesus.presedo-15 boris70-01
        jkraemer-22 alistairewj-425 bmrc_kntoosi-14 cvspc_teh_2012-11 julian.karch-11
        lixuejianwork-15 zoltan.gilian-12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: data/tools/wfdb
          key: wfdb-10.7.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup_linux.sh') }}
      - uses: actions/cache@v4
        with:
          path: data/challenge-2014.zip
          key: challenge-2014-d96fa8fd74a04d3935b1bd8b186c88afc0a4074b29dad9d2b1ba30b68ecab352
      - run: ./scripts/setup_linux.sh
      - run: uv sync --group dev
      - name: Fetch and verify the archive
        run: |
          uv run physio-beat-bench fetch | tee fetch.txt
          grep -q "Matches the archive behind the published results" fetch.txt
      - run: uv run physio-beat-bench --results diag-results entries --jobs "$(nproc)" --only $ENTRIES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-${{ runner.arch }}
          path: |
            diag-results/
            work/runs/**/*.log
            work/runs/**/outputs/*.qrs
