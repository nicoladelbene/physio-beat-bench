[project]
name = "physio-beat-bench"
version = "0.1.0"
description = "Do 2014 heartbeat detectors still work? An independent, reproducible re-run of the PhysioNet/CinC Challenge 2014 archive."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Nicola Del Bene" }]
dependencies = ["numpy>=2", "wfdb>=4.3", "matplotlib>=3.9", "pandas>=2"]

[project.optional-dependencies]
modern = ["neurokit2>=0.2.13"]

[project.scripts]
physio-beat-bench = "physio_beat_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physio_beat_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
